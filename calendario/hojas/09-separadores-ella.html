<!DOCTYPE html>

      <div class="plana-body">

            <svg width="20" height="20" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 8 L22 16 L30 16 L24 21 L26 30 L20 24 L14 30 L16 21 L10 16 L18 16 Z"/></svg>

              <div class="loop l"></div>

              <div class="knot"></div>
