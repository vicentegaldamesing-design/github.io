<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hoja 10 · Números e iconos para ella</title>
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="stylesheet" href="../css/sheets.css" />
</head>
<body>
  <div class="workspace">
    <article class="plana plana--a3">
      <header class="plana-header">
        <h1>Hoja de números e iconos · para ella</h1>
        <span class="num">Hoja 10 / 14</span>
      </header>
      <div class="plana-body">
        <p class="dims-note" style="margin-bottom:0.5cm">24 etiquetas individuales · recorta por la línea sólida y pega en cada cajita</p>
        <div id="tags" class="tags"></div>
      </div>
    </article>
  </div>
  <script src="../js/icons.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    const tags = document.getElementById('tags');
    for (let d = 1; d <= 24; d++) {
      const tag = document.createElement('div');
      const bg = colorFor('ella', d);
      tag.className = 'tag' + (bg === '#f4c2c2' ? ' light' : '');
      tag.style.background = bg;
      tag.innerHTML = `<span class="num">${d}</span><div class="icon-wrap">${iconFor('ella', d)}</div>`;
      tags.appendChild(tag);
    }
  </script>
</body>
</html>
