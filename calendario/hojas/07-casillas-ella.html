<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hoja 07 · Casillas para ella</title>
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="stylesheet" href="../css/sheets.css" />
</head>
<body>
  <div class="workspace">
    <article class="plana plana--a3">
      <header class="plana-header">
        <h1>Interior · Casillas para ella</h1>
        <span class="num">Hoja 07 / 14</span>
      </header>
      <div class="plana-body">
        <p class="dims-note" style="margin-bottom:0.5cm">Rejilla 4×6 · cara interior 36 × 24 cm · cada casilla 6 × 6 cm (cajitas con pestaña: ver hoja 10)</p>
        <div id="grid" class="casillas"></div>
        <div class="legend" style="margin-top:0.8cm">
          <div class="legend-item"><span class="legend-line cut"></span> Recorta cada casilla</div>
          <div class="legend-item">Colores: burdeos · rosa · blush · vino</div>
        </div>
      </div>
    </article>
  </div>
  <script src="../js/icons.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    const grid = document.getElementById('grid');
    for (let d = 1; d <= 24; d++) {
      const cell = document.createElement('div');
      const bg = colorFor('ella', d);
      cell.className = 'casilla' + (bg === '#f4c2c2' ? ' light' : '');
      cell.style.background = bg;
      cell.innerHTML = `<span class="num">${d}</span><div class="icon-wrap">${iconFor('ella', d)}</div>`;
      grid.appendChild(cell);
    }
  </script>
</body>
</html>
